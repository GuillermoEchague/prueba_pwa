<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Combo en la Feria</title>
  <meta name="description" content="Juego de peleas 2D en pixel art, ambientado en una feria chilena.">
  <meta name="theme-color" content="#141026">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Combo Feria">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root { --noche: #141026; --panel: #1d1735; --linea: #3a3066; --papel: #f3ead8; --tenue: #aaa2cc; --maravilla: #ffc23a; --ink: #1b1226; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--noche); color: var(--papel); overflow: hidden;
      font-family: 'Silkscreen', ui-monospace, monospace; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    /* El juego queda dentro de la zona segura (sin el notch) */
    #game { position: fixed; inset: 0;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

    /* Aviso para girar el teléfono */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--noche);
      flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 24px; }
    #rotate .phone { width: 46px; height: 80px; border: 4px solid var(--maravilla); border-radius: 8px; animation: girar 1.8s ease-in-out infinite; }
    #rotate p { margin: 0; font-size: 16px; line-height: 1.5; max-width: 22ch; }
    @keyframes girar { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }

    /* Avisos (versión nueva, listo sin internet) */
    #toast { position: fixed; z-index: 20; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 150%);
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 24px);
      background: var(--panel); border: 2px solid var(--linea); border-radius: 8px; padding: 10px 12px; font-size: 12px;
      transition: transform .25s ease; }
    #toast.open { transform: translate(-50%, 0); }
    button { font: inherit; font-size: 12px; border: 0; border-radius: 4px; padding: 8px 12px; cursor: pointer;
      background: var(--maravilla); color: var(--ink); box-shadow: 0 3px 0 #a8740a; }
    button.ghost { background: transparent; color: var(--papel); box-shadow: inset 0 0 0 2px var(--linea); }

    /* Guía para instalar en iPhone */
    #ios-help { display: none; position: fixed; inset: 0; z-index: 30; background: rgba(14, 10, 30, .92);
      align-items: center; justify-content: center; padding: 24px; }
    #ios-help.open { display: flex; }
    #ios-help .card { background: var(--panel); border: 2px solid var(--linea); border-radius: 10px; padding: 20px; max-width: 420px; }
    #ios-help h2 { margin: 0 0 12px; color: var(--maravilla); font-size: 18px; }
    #ios-help ol { margin: 0 0 16px; padding-left: 20px; line-height: 1.7; font-size: 13px; font-family: system-ui, sans-serif; }
    #ios-help b { color: var(--maravilla); }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="rotate" role="alert">
    <div class="phone" aria-hidden="true"></div>
    <p>Gira tu teléfono para jugar</p>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="ios-help" role="dialog" aria-labelledby="ios-help-title">
    <div class="card">
      <h2 id="ios-help-title">Instalar en iPhone</h2>
      <ol>
        <li>Abre este juego en <b>Safari</b>.</li>
        <li>Toca el botón <b>Compartir</b> (el cuadrado con una flecha hacia arriba).</li>
        <li>Elige <b>Agregar a inicio</b> y luego <b>Agregar</b>.</li>
        <li>Abre el juego desde el ícono nuevo: se verá a pantalla completa y funcionará sin internet.</li>
      </ol>
      <button type="button" id="ios-help-close">Entendido</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
